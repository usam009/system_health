<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Health</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; margin: 2rem; }
    h1 { margin-top: 0; }
    .card { background: #1c1c1c; padding: 1rem; margin-bottom: 1rem; border-radius: 8px; }
    .row { display: flex; justify-content: space-between; padding: 2px 0; }
    #status { color: #888; }
  </style>
</head>
<body>
  <h1>System Health</h1>
  <p id="status">Connecting...</p>

  <div class="card"><h3>System</h3><div id="system"></div></div>
  <div class="card"><h3>CPU</h3><div id="cpu"></div></div>
  <div class="card"><h3>Memory</h3><div id="memory"></div></div>
  <div class="card"><h3>Disk</h3><div id="disk"></div></div>
  <div class="card"><h3>Network</h3><div id="network"></div></div>

  <script>
    function row(label, value) {
      return `<div class="row"><span>${label}</span><span>${value}</span></div>`;
    }

    function formatUptime(s) {
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      return `${d}d ${h}h ${m}m`;
    }

    async function update() {
      try {
        const res = await fetch("/api/metrics");
        const m = await res.json();

        document.getElementById("system").innerHTML =
          row("Host", m.system.hostname) +
          row("OS", m.system.os) +
          row("Kernel", m.system.kernel) +
          row("Uptime", formatUptime(m.system.uptime_seconds));

        document.getElementById("cpu").innerHTML =
          row("Usage", m.cpu.percent + " %") +
          row("Cores", m.cpu.cores) +
          row("Load (1/5/15 min)", m.cpu.load.join(" / "));

        document.getElementById("memory").innerHTML =
          row("Usage", m.memory.percent + " %") +
          row("Used", m.memory.used_gb + " / " + m.memory.total_gb + " GB") +
          row("Swap", m.memory.swap_percent + " %");

        document.getElementById("disk").innerHTML =
          m.disk.partitions.map(p => row(p.mount, p.percent + " % (" + p.used_gb + " / " + p.total_gb + " GB)")).join("") +
          row("Read", m.disk.read_kbps + " KB/s") +
          row("Write", m.disk.write_kbps + " KB/s");

        document.getElementById("network").innerHTML =
          m.network.map(n => row(n.iface, "↑ " + n.up_kbps + "  ↓ " + n.down_kbps + " KB/s")).join("");

        document.getElementById("status").textContent =
          "Updated " + new Date().toLocaleTimeString();
      } catch (e) {
        document.getElementById("status").textContent = "Connection lost";
      }
    }

    update();
    setInterval(update, 2000);
  </script>
</body>
</html>
